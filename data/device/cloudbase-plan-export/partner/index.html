<style>
html,body{margin:0;background:#0b0e14;color:#e7ecf5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#g{position:fixed;inset:0;z-index:99999;background:#0b0e14;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{width:100%;max-width:420px;background:#141922;border:1px solid #2a3245;border-radius:14px;padding:28px 26px;box-sizing:border-box}
.brand{font-size:17px;font-weight:700;margin-bottom:8px}
.sub{font-size:12.5px;color:#8b96a8;line-height:1.7;margin-bottom:22px}
.row{margin-bottom:14px}
label{display:block;font-size:12px;color:#9aa7bd;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #2a3245;background:#0e1117;color:#e7ecf5;font-size:13.5px;font-family:inherit}
input:focus{outline:none;border-color:#4f8cff}
button{width:100%;margin-top:8px;padding:11px;border-radius:8px;border:1px solid #4f8cff;background:#1c2233;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{background:#243049}
button:disabled{opacity:.5;cursor:default}
.err{color:#e25c5c;font-size:12.5px;min-height:18px;margin-top:8px}
.note{font-size:11px;color:#6f7686;line-height:1.7;margin-top:10px}
.meta{font-size:11px;color:#6f7686;margin-top:14px;padding-top:12px;border-top:1px solid #2a3245;line-height:1.8}
#wm{position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;opacity:.055;transition:opacity .25s}
#wm.hot{opacity:.30}
#wm span{display:inline-block;width:33.33%;height:120px;box-sizing:border-box;transform:rotate(-22deg);transform-origin:center;font-size:13px;color:#7fb0ff;text-align:center;line-height:120px;white-space:nowrap;user-select:none}
@media print{#wm{opacity:.34!important}#wm span{color:#4f8cff}}
body.locked{-webkit-user-select:none;user-select:none}
body.locked input{-webkit-user-select:text;user-select:text}
</style>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var $ = function(i){ return document.getElementById(i); };

  function b64d(s){
    var bin = atob(s), len = bin.length, u = new Uint8Array(len);
    for (var i=0;i<len;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function b64dStr(s){
    var bin = atob(s), len = bin.length, u = new Uint8Array(len);
    for (var i=0;i<len;i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(u);
  }
  async function deriveKEK(pw, salt, iter){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256'}, base, 256);
    return crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['decrypt']);
  }

  // 页面启动即显示有效期
  var exp = new Date(P.expires_at);
  $('meta').innerHTML = '本链接有效期至 ' + exp.toLocaleString('zh-CN')

  async function submit(){
    var n = $('n').value.trim(), o = $('o').value.trim(), pw = $('p').value;
    if(!n){ $('e').textContent='请填写姓名'; return; }
    if(!o){ $('e').textContent='请填写单位'; return; }
    if(!pw){ $('e').textContent='请填写口令'; return; }
    $('go').disabled = true; $('e').textContent = '正在校验…';

    var ck = null, hit = null;
    for (var i=0;i<P.keys.length;i++){
      var k = P.keys[i];
      try {
        var kek = await deriveKEK(pw, b64d(k.salt), P.iter);
        var raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(k.iv)}, kek, b64d(k.wrapped));

      $('e').textContent = '口令不正确，或该口令已失效。';
      $('go').disabled = false; return;

      var r = await fetch(location.href, {method:'HEAD', cache:'no-store'});
