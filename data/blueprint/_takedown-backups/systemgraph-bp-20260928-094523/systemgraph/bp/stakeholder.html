    } catch(e){}
    if (now > exp.getTime()){
      $('e').textContent = '此链接已过期（有效期至 ' + exp.toLocaleString('zh-CN') + '）。请联系文件提供方重新获取。';
      $('go').disabled = false; return;
    }

    var html;
    try {
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, ck, b64d(P.ct));
      html = new TextDecoder().decode(plain);
    } catch(e){
      $('e').textContent = '内容解密失败（文件可能已损坏）。';
      $('go').disabled = false; return;
    }

    // 渲染
    document.open(); document.write(html); document.close();
    document.body.classList.add('locked');

    // 水印图层已在正文里（加密前注入）；这里只负责设置查看人并切换触发态
    window.__DSH_VIEWER = n + ' · ' + o + ' · ' + new Date(now).toISOString().slice(0,16).replace('T',' ');
    var wm = document.getElementById('dsh-copy');
    function hot(){ if(wm){ wm.classList.add('hot'); } if(window.__DSH_PAINT) window.__DSH_PAINT(false); }
    function cold(){ if(wm){ wm.classList.remove('hot'); } if(window.__DSH_PAINT) window.__DSH_PAINT(true); }

    window.addEventListener('beforeprint', hot);
    window.addEventListener('afterprint', cold);
    window.addEventListener('blur', hot);
    window.addEventListener('focus', function(){ setTimeout(cold,1200); });
    document.addEventListener('visibilitychange', function(){
      if(document.hidden){ hot(); } else { setTimeout(cold,1200); }
    });
    document.addEventListener('keyup', function(ev){
      if(ev.key==='PrintScreen'){ hot(); setTimeout(cold,6000); }
    });

    // 防顺手复制
    document.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
    document.addEventListener('copy', function(ev){ ev.preventDefault(); });
    document.addEventListener('cut', function(ev){ ev.preventDefault(); });
    document.addEventListener('selectstart', function(ev){
      var t=ev.target;
      if(t && t.closest && (t.closest('input')||t.closest('textarea'))) return;
      ev.preventDefault();
    });
    document.addEventListener('keydown', function(ev){
      var k=(ev.key||'').toLowerCase();
      if((ev.ctrlKey||ev.metaKey) && ['c','x','a','u','s','p'].indexOf(k)>=0) ev.preventDefault();
      if(k==='f12') ev.preventDefault();
      if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&['i','j','c'].indexOf(k)>=0) ev.preventDefault();
    });
  }

  $('go').onclick = submit;
  ['n','o','p'].forEach(function(i){ $(i).addEventListener('keydown', function(ev){ if(ev.key==='Enter') submit(); }); });
  $('n').focus();
})();
</script>
</body>
</html>
