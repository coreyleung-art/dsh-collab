<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1056" viewBox="0 0 1560 1056"><rect width="1560" height="1056" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">明鉴交付工具链（内容交付的方法固化）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:mingjian-toolchain · v1.0 · 维度:?</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: 每个工具须有自测证据（实测输出）方计入；仅有设计未实测的不入册。已知边界：加密门禁的有效期只能防君子（静态站无后端）；受众检查是关键词闸门，语义漏报须叠加逐单元审查。</text><rect x="24.0" y="76" width="241.33333333333334" height="644" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">决策线</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">四跑法标准框架 + 六维打分</text><rect x="38.0" y="132" width="201.33333333333334" height="58" rx="8" fill="#0d1119" stroke="#34c77b" stroke-width="1.5"/><text x="50.0" y="152" fill="#34c77b" font-size="12" font-weight="bold">tc-s1 · P0 三个（全载体扫描/逐字节验证/多视角红队）</text><text x="213.33333333333337" y="152" fill="#8b90a3" font-size="10">✅</text><rect x="38.0" y="198" width="201.33333333333334" height="58" rx="8" fill="#0d1119" stroke="#34c77b" stroke-width="1.5"/><text x="50.0" y="218" fill="#34c77b" font-size="12" font-weight="bold">tc-s2 · P1 补完（逐单元审查/界面验证/受众检查/P16）</text><text x="213.33333333333337" y="218" fill="#8b90a3" font-size="10">✅</text><rect x="38.0" y="264" width="201.33333333333334" height="58" rx="8" fill="#0d1119" stroke="#34c77b" stroke-width="1.5"/><text x="50.0" y="284" fill="#34c77b" font-size="12" font-weight="bold">tc-s3 · P2 编排（四跑法框架/交付链）</text><text x="213.33333333333337" y="284" fill="#8b90a3" font-size="10">✅</text><rect x="38.0" y="330" width="201.33333333333334" height="58" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="50.0" y="350" fill="#7d8596" font-size="12" font-weight="bold">tc-s4 · 插件化（工具入 CP / 凭据防火墙）</text><text x="213.33333333333337" y="350" fill="#8b90a3" font-size="10">⬜</text><rect x="277.33333333333337" y="76" width="241.33333333333334" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="291.33333333333337" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">编排线</text><text x="291.33333333333337" y="116" fill="#8b90a3" font-size="10">11 步交付链一条命令</text><rect x="530.6666666666667" y="76" width="241.33333333333334" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="544.6666666666667" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">审查线</text><text x="544.6666666666667" y="116" fill="#8b90a3" font-size="10">多视角红队 + 逐单元语义审查 + 立场16项 + 受众分层</text><rect x="784.0" y="76" width="241.33333333333334" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="798.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">一致性线</text><text x="798.0" y="116" fill="#8b90a3" font-size="10">一事实多载体 → 全载体扫描</text><rect x="1037.3333333333335" y="76" width="241.33333333333334" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="1051.3333333333335" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">安全线</text><text x="1051.3333333333335" y="116" fill="#8b90a3" font-size="10">真加密门禁 + 口令槽位管理 + 凭据纪律</text><rect x="1290.6666666666667" y="76" width="241.33333333333334" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="1304.6666666666667" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">验证线</text><text x="1304.6666666666667" y="116" fill="#8b90a3" font-size="10">交付前逐字节比对 + 界面三重验证</text><line x1="20" y1="1000" x2="1540" y2="1000" stroke="#232a3a"/><text x="20" y="1020" fill="#8b90a3" font-size="11">✅ 已完成</text><text x="170" y="1020" fill="#8b90a3" font-size="11">🟢 进行中</text><text x="320" y="1020" fill="#8b90a3" font-size="11">🟡 部分</text><text x="470" y="1020" fill="#8b90a3" font-size="11">⬜ 待做</text><text x="1180" y="1020" fill="#8b90a3" font-size="11" text-anchor="end">主线 6 · 主阶段 4 · vv1.0</text></svg>