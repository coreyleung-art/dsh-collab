<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="606" viewBox="0 0 1560 606"><rect width="1560" height="606" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">内存治理（L1 工具链 + L2 体系化持久化 + risk 推进风险预判）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:memory-governance · v1.0 · 维度:子蓝图</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: ① 每突进纳入生产：评估报告→人类确认（R027 L3）→才实施 ② 改 CLD 宿主配置先隔离验证+备份+dump-config 零报错 ③ 内存压力&gt;85%/swap&gt;90% </text><rect x="24.0" y="76" width="494.6666666666667" height="494" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#2ac3de" font-size="15" font-weight="bold">工具链内存治理（现时·效率）</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">现有智能体工具链带出的内存延伸问题：compaction/pruner/批处理+缓存——239MB 膨胀治理</text><rect x="38.0" y="132" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#4a9eff" stroke-width="1.5"/><text x="50.0" y="152" fill="#4a9eff" font-size="12" font-weight="bold">M1 · L1 上下文压缩（compaction）</text><text x="466.66666666666674" y="152" fill="#8b90a3" font-size="10">🟢</text><text x="54.0" y="168" fill="#34c77b" font-size="10.5">◦ mg1-1 compaction 挂载</text><text x="54.0" y="185" fill="#4a9eff" font-size="10.5">◦ mg1-2 /compact 手动入口+水位试点</text><text x="54.0" y="202" fill="#7d8596" font-size="10.5">◦ mg1-3 摘要保留策略</text><rect x="38.0" y="226" width="454.6666666666667" height="66" rx="8" fill="#0d1119" stroke="#4a9eff" stroke-width="1.5"/><text x="50.0" y="246" fill="#4a9eff" font-size="12" font-weight="bold">M2 · L1 工具结果裁剪</text><text x="466.66666666666674" y="246" fill="#8b90a3" font-size="10">🟢</text><text x="54.0" y="262" fill="#34c77b" font-size="10.5">◦ mg2-1 pruner 启用</text><text x="54.0" y="279" fill="#7d8596" font-size="10.5">◦ mg2-2 大输出落盘</text><rect x="38.0" y="300" width="454.6666666666667" height="66" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="50.0" y="320" fill="#7d8596" font-size="12