<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="756" viewBox="0 0 1560 756"><rect width="1560" height="756" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">GeneBank 基因库（AI 网盘存储底座）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:gene-bank · v1.0 · 维度:?</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: ① 资产唯一性=内容寻址(sha256 去重) ② 血缘可溯(parent_genes) ③ 变异可回退(语义版本) ④ 表达可验证(manifest 一致性) ⑤ 染色体分类可扩</text><rect x="24.0" y="76" width="368.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">染色体分类</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">6 染色体：models/datasets/corpora/knowledge/artifacts/recipes——可扩展枚举</text><rect x="38.0" y="132" width="328.0" height="66" rx="8" fill="#0d1119" stroke="#4a9eff" stroke-width="1.5"/><text x="50.0" y="152" fill="#4a9eff" font-size="12" font-weight="bold">P1 · 染色体体系</text><text x="340.0" y="152" fill="#8b90a3" font-size="10">🟢</text><text x="54.0" y="168" fill="#34c77b" font-size="10.5">◦ gb2-1 六染色体落地</text><text x="54.0" y="185" fill="#34c77b" font-size="10.5">◦ gb2-2 可扩展枚举</text><rect x="404.0" y="76" width="368.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="418.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">自进化接口</text><text x="418.0" y="116" fill="#8b90a3" font-size="10">新染色体声明即用；资产表达式(expression)可验证承诺</text><rect x="418.0" y="132" width="328.0" height="66" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="430.0" y="152" fill="#7d8596" font-size="12" font-weight="bold">P3 · 自进化</text><text x="720.0" y="152" fill="#8b90a3" font-size="10">⬜</text><text x="434.0" y="168" fill="#7d8596" font-size="10.5">◦ gb4-1 与知识图谱衔接</text><text x="434.0" y="185" fill="#7d8596" font-size="10.5">◦ gb4-2 跨蓝图资产登记</text><rect x="784.0" y="76" width="368.0" height="194" fill="#141824" rx="10" stroke="#232a3a" st