<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="606" viewBox="0 0 1560 606"><rect width="1560" height="606" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">裁判层/规则引擎（AI 提议→确定性验证→打回重来）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:rule-judge · v1.0 · 维度:验证</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: ① L1 机械验证 fail-closed 达标才进 L2 ② L2 规则灰度（影子模式误杀率达标）才转硬阻断 ③ L3 语义软门只决定 retry/escalate ④ 每动作四</text><rect x="24.0" y="76" width="494.6666666666667" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#e5c07b" font-size="15" font-weight="bold">审计证据层</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">全量审计链：谁提议/依据/逐条校验结果/谁放行——可回放可复核</text><rect x="38.0" y="132" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#f5b942" stroke-width="1.5"/><text x="50.0" y="152" fill="#f5b942" font-size="12" font-weight="bold">4.0 · 审计证据</text><text x="466.66666666666674" y="152" fill="#8b90a3" font-size="10">🟡</text><text x="54.0" y="168" fill="#4a9eff" font-size="10.5">◦ rj4-1 全量审计链</text><text x="54.0" y="185" fill="#7d8596" font-size="10.5">◦ rj4-2 证据字段规范</text><text x="54.0" y="202" fill="#7d8596" font-size="10.5">◦ rj4-3 月度审计</text><rect x="530.6666666666667" y="76" width="494.6666666666667" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="544.6666666666667" y="98" fill="#e5c07b" font-size="15" font-weight="bold">打回循环</text><text x="544.6666666666667" y="116" fill="#8b90a3" font-size="10">有界 verify-repair 循环：最大重试+预算上限+单调退化检测→停止降级（人工/L2D）</text><rect x="544.6666666666667" y="132" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="556.6666666666667" y="152" fill="#7d8596" font-size="12" font-weight="bold">3.0 · 有界打回循环</text><text x="973.3333333333335" y="152" fill="#8b90a3" font-size="10">⬜</text><text x="560.6666666666667" y="168" fill="#7d8596" font-size="10.5">◦ rj3-1 verify-repair 循环</text><text x="560.6666666666667" y="185" fill="#7d8596" font-size="10.5">◦ rj3-2 降级路径</text><text x="560.6666666666667" y="202" fill="#7d8596" font-size="10.5">◦ rj3-3 失败信号回流</text><rect x="1037.3333333333335" y="76" width="494.6666666666667" height="344" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="1051.3333333333335" y="98" fill="#e5c07b" font-size="15" font-weight="bold">验证层</text><text x="1051.3333333333335" y="116" fill="#8b90a3" font-size="10">三层验证漏斗：L1 机械（schema/类型 100%确定性）→ L2 规则（业务断言/红线）→ L3 语义（模型侧软门）</text><rect x="1051.3333333333335" y="132" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#4a9eff" stroke-width="1.5"/><text x="1063.3333333333335" y="152" fill="#4a9eff" font-size="12" font-weight="bold">1.0 · L1 机械验证</text><text x="1480.0000000000002" y="152" fill="#8b90a3" font-size="10">🟢</text><text x="1067.3333333333335" y="168" fill="#4a9eff" font-size="10.5">◦ rj1-1 结构化动作契约</text><text x="1067.3333333333335" y="185" fill="#4a9eff" font-size="10.5">◦ rj1-2 类型/格式约束</text><text x="1067.3333333333335" y="202" fill="#7d8596" font-size="10.5">◦ rj1-3 反向用例自检</text><rect x="1051.3333333333335" y="226" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="1063.3333333333335" y="246" fill="#7d8596" font-size="12" font-weight="bold">2.0 · L2 规则验证</text><text x="1480.0000000000002" y="246" fill="#8b90a3" font-size="10">⬜</text><text x="1067.3333333333335" y="262" fill="#7d8596" font-size="10.5">◦ rj2-1 业务断言库</text><text x="1067.3333333333335" y="279" fill="#7d8596" font-size="10.5">◦ rj2-2 策略编译</text><text x="1067.3333333333335" y="296" fill="#7d8596" font-size="10.5">◦ rj2-3 灰度影子模式</text><line x1="20" y1="550" x2="1540" y2="550" stroke="#232a3a"/><text x="20" y="570" fill="#8b90a3" font-size="11">✅ 已完成</text><text x="170" y="570" fill="#8b90a3" font-size="11">🟢 进行中</text><text x="320" y="570" fill="#8b90a3" font-size="11">🟡 