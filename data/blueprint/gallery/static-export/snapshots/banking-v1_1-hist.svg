<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="606" viewBox="0 0 1560 606"><rect width="1560" height="606" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">银行业务线·活动礼品公司（银行礼品+活动+CO+生态）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:banking · v1.1 · 维度:业务</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: ① 业务线 bk1 客户版图+执行 SOP 稳定 ② CO+ 生态 bk2 需业务线现金流支撑（共建方≥N）③ 资源线 bk3 脱敏合规（C3 凭据纪律：登记归属不登内容）</text><rect x="24.0" y="76" width="494.6666666666667" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#f5b942" font-size="15" font-weight="bold">业务线</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">银行礼品+活动服务：中标→策划→执行→续约（6 年广东省金融业，95% 客户为银行）</text><rect x="38.0" y="132" width="454.6666666666667" height="106" rx="8" fill="#0d1119" stroke="#4a9eff" stroke-width="1.5"/><text x="50.0" y="152" fill="#4a9eff" font-size="12" font-weight="bold">1.0 · 业务体系</text><text x="466.66666666666674" y="152" fill="#8b90a3" font-size="10">🟢</text><text x="54.0" y="168" fill="#4a9eff" font-size="10.5">◦ bk1-1 银行客户版图</text><text x="54.0" y="185" fill="#4a9eff" font-size="10.5">◦ bk1-2 活动策划执行</text><text x="54.0" y="202" fill="#7d8596" font-size="10.5">◦ bk1-3 礼品供应</text><text x="54.0" y="219" fill="#7d8596" font-size="10.5">◦ bk1-4 融资与投资文档</text><rect x="530.6666666666667" y="76" width="494.6666666666667" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="544.6666666666667" y="98" fill="#f5b942" font-size="15" font-weight="bold">生态线</text><text x="544.6666666666667" y="116" fill="#8b90a3" font-size="10">CO+（Co. Plus 共建平台）：银行资源×异业共建，流量池+共建方+共建产品自增强</text><rect x="544.6666666666667" y="132" width="454.6666666666667" height="86" rx="8" fill="#0d1119" stroke="#7d8596" stroke-width="1.5"/><text x="556.6666666666667" y="152" fill="#7d8596" font-size="12" font-weight="bold">2.0 · CO+ 生态</text><text x="973.3333333333335" y="152" fill="#8b9