<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1356" viewBox="0 0 1560 1356"><rect width="1560" height="1356" fill="#0d1119" rx="14"/><text x="20" y="34" fill="#e8eaf0" font-size="21" font-weight="bold">花联网合资公司（战略/资本/股权治理/里程碑 公司级）</text><text x="20" y="56" fill="#8b90a3" font-size="13">blueprint:flowernet-jv · v1.1 · 维度:?</text><text x="20" y="76" fill="#f0b429" font-size="11">门禁: 里程碑 M1 成都样板(单城单位经济为正) → M2 5城复制 → M3 10城满配(年净0.7-0.9亿/AI≥30%) → M4 30城(年净2.1-2.7亿/数据底座成) →</text><rect x="24.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="38.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">架构线</text><text x="38.0" y="116" fill="#8b90a3" font-size="10">分布式采集落店(真实IP+指纹)+中央云(数据/管理中枢)+算力租赁+三层分工(创始人=智能体设计师/FDE=工程落地/智能体=执行)</text><rect x="214.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="228.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">预算线</text><text x="228.0" y="116" fill="#8b90a3" font-size="10">种子九类(A成都样板/B数据底座/C AI工具/D IP首场/E供应链/F能力层/G机动/H硬件非云/I云资源)+各轮递增</text><rect x="404.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="418.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">业务线条</text><text x="418.0" y="116" fill="#8b90a3" font-size="10">代运营线(平台增量)/IP商品线(女性向IP)/软硬件数据线(AI工具订阅+数据端口)/底座线(订单级数据回流卖水人)</text><rect x="594.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="608.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">资本线</text><text x="608.0" y="116" fill="#8b90a3" font-size="10">投资计划/融资节奏/投资节奏</text><rect x="784.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="798.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">股权治理线</text><text x="798.0" y="116" fill="#8b90a3" font-size="10">股权设计/双层有限合伙/AB股/对赌/激励</text><rect x="974.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="988.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">对外线</text><text x="988.0" y="116" fill="#8b90a3" font-size="10">公开计划书/BP完整版</text><rect x="1164.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="1178.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">里程碑线</text><text x="1178.0" y="116" fill="#8b90a3" font-size="10">平台×业务×规模矩阵/估值支撑链</text><rect x="1354.0" y="76" width="178.0" height="194" fill="#141824" rx="10" stroke="#232a3a" stroke-width="1"/><text x="1368.0" y="98" fill="#6ea8ff" font-size="15" font-weight="bold">战略线</text><text x="1368.0" y="116" fill="#8b90a3" font-size="10">沙盘推演/地位排序/怎么赢/终局</text><line x1="20" y1="1300" x2="1540" y2="1300" stroke="#232a3a"/><text x="20" y="1320" fill="#8b90a3" font-size="11">✅ 已完成</text><text x="170" y="1320" fill="#8b90a3" font-size="11">🟢 进行中</text><text x="320" y="1320" fill="#8b90a3" font-size="11">🟡 部分</text><text x="470" y="1320" fill="#8b90a3" font-size="11">⬜ 待做</text><text x="1180" y="1320" fill="#8b90a3" font-size="11" text-anchor="end">主线 8 · 主阶段 0 · vv1.1</text></svg>