<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1530" viewBox="0 0 1700 1530"><rect width="1700" height="1530" fill="#0d1119" rx="14"/><text x="30" y="36" fill="#e8eaf0" font-size="20" font-weight="bold">明鉴交付工具链（内容交付的方法固化） · 鱼骨图</text><text x="30" y="58" fill="#8b90a3" font-size="12">目标 ← 主线(大骨) ← 主阶段(中骨) ← 子阶段(小骨) · 点击骨头展开/收起</text><line x1="200" y1="180" x2="1560" y2="180" stroke="#6ea8ff" stroke-width="6" opacity="0.7"/><polygon points="1600,128 1680,180 1600,232" fill="#6ea8ff" opacity="0.9"/><text x="1592" y="185" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">决策线</text><text x="160" y="162" fill="#6ea8ff" font-size="14" font-weight="bold" text-anchor="end">decide</text><text x="160" y="180" fill="#8b90a3" font-size="10" text-anchor="end">四跑法标准框架 + 六维打分</text><line x1="200" y1="420" x2="1560" y2="420" stroke="#34c77b" stroke-width="6" opacity="0.7"/><polygon points="1600,368 1680,420 1600,472" fill="#34c77b" opacity="0.9"/><text x="1592" y="425" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">编排线</text><text x="160" y="402" fill="#34c77b" font-size="14" font-weight="bold" text-anchor="end">orchestrate</text><text x="160" y="420" fill="#8b90a3" font-size="10" text-anchor="end">11 步交付链一条命令</text><line x1="200" y1="660" x2="1560" y2="660" stroke="#f5b942" stroke-width="6" opacity="0.7"/><polygon points="1600,608 1680,660 1600,712" fill="#f5b942" opacity="0.9"/><text x="1592" y="665" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">审查线</text><text x="160" y="642" fill="#f5b942" font-size="14" font-weight="bold" text-anchor="end">review</text><text x="160" y="660" fill="#8b90a3" font-size="10" text-anchor="end">多视角红队 + 逐单元语义审查 + 立场16项 + 受众分层</text><line x1="200" y1="900" x2="1560" y2="900" stroke="#e06c75" stroke-width="6" opacity="0.7"/><polygon points="1600,848 1680,900 1600,952" fill="#e06c75" opacity="0.9"/><text x="1592" y="905" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">一致性线</text><text x="160" y="882" fill="#e06c75" font-size="14" font-weight="bold" text-anchor="end">scan</text><text x="160" y="900" fill="#8b90a3" font-size="10" text-anchor="end">一事实多载体 → 全载体扫描</text><line x1="200" y1="1140" x2="1560" y2="1140" stroke="#c678dd" stroke-width="6" opacity="0.7"/><polygon points="1600,1088 1680,1140 1600,1192" fill="#c678dd" opacity="0.9"/><text x="1592" y="1145" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">安全线</text><text x="160" y="1122" fill="#c678dd" font-size="14" font-weight="bold" text-anchor="end">secure</text><text x="160" y="1140" fill="#8b90a3" font-size="10" text-anchor="end">真加密门禁 + 口令槽位管理 + 凭据纪律</text><line x1="200" y1="1380" x2="1560" y2="1380" stroke="#e5c07b" stroke-width="6" opacity="0.7"/><polygon points="1600,1328 1680,1380 1600,1432" fill="#e5c07b" opacity="0.9"/><text x="1592" y="1385" fill="#fff" font-size="15" font-weight="bold" text-anchor="end">验证线</text><text x="160" y="1362" fill="#e5c07b" font-size="14" font-weight="bold" text-anchor="end">verify</text><text x="160" y="1380" fill="#8b90a3" font-size="10" text-anchor="end">交付前逐字节比对 + 界面三重验证</text><text x="60" y="1508" fill="#8b90a3" font-size="12">✅ 完成</text><text x="180" y="1508" fill="#8b90a3" font-size="12">🟢 进行中</text><text x="300" y="1508" fill="#8b90a3" font-size="12">🟡 部分</text><text x="420" y="1508" fill="#8b90a3" font-size="12">⬜ 待做</text><text x="540" y="1508" fill="#8b90a3" font-size="12">点击主线骨头展开/收起子阶段</text></svg>